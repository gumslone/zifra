; PlatformIO build for the zifra firmware — an alternative to the arduino-cli
; build in build.sh, which remains the release reference. Same Arduino core:
; espressif8266@2.6.3 bundles core 2.7.4, matching build.sh's pinned core.
;
;   pio run                       # all envs
;   pio run -e esp8285            # stock board, release
;   pio run -e esp8266_generic    # generic 1M ESP8266 module, release

[platformio]
src_dir = zifra
default_envs = esp8285, esp8266_generic

[env]
platform = espressif8266@2.6.3
framework = arduino
; vendored copies of the exact library versions the firmware was built with
lib_extra_dirs = libraries
; deep (NOT deep+): deep+ evaluates preprocessor guards and then misses
; arduinoWebSockets' guarded <ESP8266WiFi.h> dependency; deep follows every
; include and resolves it.
lib_ldf_mode = deep
; same 1MB / 64KB-FS flash layout the arduino-cli FQBNs use
board_build.ldscript = eagle.flash.1m64.ld

[env:esp8285]
board = esp8285

[env:esp8285_debug]
board = esp8285
build_flags = -DDEBUG=1

[env:esp8266_generic]
board = esp01_1m
; the board variant alone does not define the generic gate
build_flags = -DARDUINO_ESP8266_GENERIC

[env:esp8266_generic_debug]
board = esp01_1m
build_flags = -DARDUINO_ESP8266_GENERIC -DDEBUG=1
