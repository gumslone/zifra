name: Build release

# Builds the firmware and publishes a GitHub release whenever a pull
# request from the "development" branch is merged into "main".
# Can also be started manually from the Actions tab.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'development')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core
        run: |
          arduino-cli config init --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@2.7.4

      # All used libraries are vendored in ./libraries and picked up by
      # build.sh via arduino-cli's --libraries flag.
      - name: Build firmware (release and debug)
        run: ./build.sh all

      - name: Read version
        id: version
        # The semantic version the firmware itself reports, from
        # zifra/src/version.h — the single source of truth.
        run: |
          v="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' zifra/src/version.h | head -n1)"
          if [ -z "$v" ]; then
            echo "Could not read ZIFRA_VERSION from zifra/src/version.h" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "Tag v$v already exists - bump ZIFRA_VERSION in zifra/src/version.h to publish a new release." >> "$GITHUB_STEP_SUMMARY"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect artifacts
        if: steps.version.outputs.exists == 'false'
        run: |
          mkdir -p dist
          v="${{ steps.version.outputs.version }}"
          cp .build/esp8285/release/zifra.ino.bin         "dist/zifra_esp8285_${v}.bin"
          cp .build/esp8285/debug/zifra.ino.bin           "dist/zifra_esp8285_${v}_debug.bin"
          cp .build/esp8266_generic/release/zifra.ino.bin "dist/zifra_esp8266_generic_${v}.bin"
          cp .build/esp8266_generic/debug/zifra.ino.bin   "dist/zifra_esp8266_generic_${v}_debug.bin"

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ZIFRA firmware ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
